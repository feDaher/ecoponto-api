services:
  mysql:
    image: mysql:8.4
    container_name: ecoponto-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecoponto
      MYSQL_USER: ecoponto_app
      MYSQL_PASSWORD: SENHA
    ports:
      - "3306:3306"
    volumes:
      - ecoponto_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  ecoponto_mysql_data:
